name: Final Post-Review Verify

on:
  push:
    branches:
      - review/recovery-release

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/recovery-release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full verification
        run: mvn -B clean verify
      - name: Validate JAR
        shell: bash
        run: |
          test -f target/DiaryKeeper-1.4.9.jar
          unzip -t target/DiaryKeeper-1.4.9.jar
          unzip -p target/DiaryKeeper-1.4.9.jar plugin.yml | grep -E '^(name|version|main|api-version):'
          sha256sum target/DiaryKeeper-1.4.9.jar
      - uses: actions/upload-artifact@v4
        with:
          name: DiaryKeeper-1.4.9-final-reviewed
          path: target/DiaryKeeper-1.4.9.jar
          if-no-files-found: error
          retention-days: 7
