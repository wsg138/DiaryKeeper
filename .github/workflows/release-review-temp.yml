name: Release Self Review

on:
  push:
    branches:
      - review/recovery-release

permissions:
  contents: write

jobs:
  review-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/recovery-release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply second-pass fixes
        run: python .github/release_review_patch2.py

      - name: Full Maven verification
        run: mvn -B clean verify

      - name: Inspect final JAR
        shell: bash
        run: |
          test -f target/DiaryKeeper-1.4.9.jar
          unzip -t target/DiaryKeeper-1.4.9.jar
          unzip -p target/DiaryKeeper-1.4.9.jar plugin.yml | grep -E '^(name|version|main|api-version):'
          sha256sum target/DiaryKeeper-1.4.9.jar

      - name: Commit final reviewed source
        shell: bash
        run: |
          git config user.name "P2wn"
          git config user.email "racecarboy77@gmail.com"
          git add src/main/java src/test/java
          git commit -m "Finish DiaryKeeper release self-review [skip ci]"
          git push origin HEAD:review/recovery-release

      - uses: actions/upload-artifact@v4
        with:
          name: DiaryKeeper-1.4.9-final
          path: target/DiaryKeeper-1.4.9.jar
          if-no-files-found: error
          retention-days: 7
