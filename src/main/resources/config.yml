# DiaryKeeper configuration
config-version: 4
#
# Notes:
# - Diaries stay WRITABLE_BOOK items forever unless you intentionally redesign that behavior in code.
# - The plugin keeps text validation strict ASCII-only to reduce book-ban style abuse.
# - Delivery fallback is queue-only. If a player is offline or full, the diary waits safely.

give-on-first-join: true

# Editing / signing
allow-signing: false
owner-only-edit: true

restrictions:
  enderchest: true
  bundles: true
  shulkers: false
  chests: false
  barrels: false
  hoppers: false
  droppers: false
  dispensers: false
  furnaces: false

# Legacy behavior flag kept for compatibility.
# Container restriction listeners still enforce the specific restriction keys above.
allow-drop: true
allow-container-move: true

indestructible:
  prevent-combust: true
  prevent-explosion: true
  prevent-contact-damage: true
  prevent-despawn: true

void:
  return-to-dropper: true
  check-interval-ticks: 10
  safe-drop-if-inventory-full: false

appearance:
  enchanted-glint: true
  # Optional Nexo item ID used as the base item for newly issued diaries.
  # Leave blank to use a normal writable book.
  nexo-item-id: "diary_book"
  name-format: "&d{owner}'s Diary"
  lore:
    - "&7A unique collectible diary."
    - "&7Owner: &f{owner}"
    - "&8ID: {id-short}"

duplicates:
  warn-on-join: true
  warn-on-container-open: true
  warn-on-chunk-load: true
  warn-on-startup: true
  staff-notify: true
  debounce-seconds: 60
  max-listed-occurrences: 5

alerts:
  enderchest-diary-on-join: true

duplicate-scan:
  enabled: true
  interval-minutes: 10
  max-players-per-tick: 2
  max-chunks-per-tick: 2
  max-entities-per-tick: 80
  repair-mode: true
  report-only: false

# Delivery queue tuning.
# These values cap work per tick so the plugin stays predictable with many players online.
delivery:
  retry-interval-ticks: 20
  max-players-per-tick: 10
  max-items-per-player-per-tick: 2

# Optional Plan Player Analytics integration.
# DiaryKeeper keeps this data itself first, then exposes a focused subset to Plan when installed.
integrations:
  plan:
    enabled: true
    recent-table-size: 10

# Bounded activity history used by admin views and optional analytics integrations.
analytics:
  retention-days: 30
  max-events: 1000

restore:
  max-ground-entity-fallback-checks: 200

# Persistent purge-and-restore work is staggered to protect the server tick.
purge:
  max-players-per-tick: 2
  max-chunks-per-tick: 1
  max-block-entities-per-tick: 50
  max-entities-per-tick: 100
  chunk-load-timeout-seconds: 15
  max-chunk-retries: 3
  max-recursion-depth: 4
  allow-restore-on-partial-purge: false
  post-purge-watch-minutes: 60
  auto-remove-reappearing-copies: false

# Periodic persistence for player diary IDs and queued deliveries.
storage:
  save-interval-ticks: 1200

debug:
  performance:
    enabled: false
    log-interval-seconds: 300
