  components:
    minecraft:writable_book_content: '{pages:[{raw:"§6§lWelcome to\n§lEnthusia SMP!§r\n\nEnthusia is a semi-anarchy survival server built around freedom, PvP, trading,\nexploration, and player interaction.\n\n§aMake your own story.§r"},{raw:"§2§lSURVIVAL§r\n\nGather resources,\nbuild a base, explore,\nand progress normally.\n\nThere are no shortcuts. Most of what you earn\ncomes from playing."},{raw:"§3§lTHE WORLD§r\n\nThe world is large\nand permanent.\n100k x 100k\n\nTravel far from spawn\nfor more safety, or\nstay close if you want\nmore chaos.\n\n§6Farther §lusually\nmeans safer.§r"},{raw:"§c§lBASES§r\n\nThere are §c§lno land\nclaims§r.\n\nYour base can be\nraided, griefed, or\nstolen from.\n\n§6§lHide it well.§r"},{raw:"§c§lPVP§r\n\nSpawn and Market are\nsafe, but outside those\nareas you should always\nbe ready.\n\n§c§lDo not carry what\nyou cannot lose.§r"},{raw:"§4§lWARZONE§r\n\nThe Warzone is near\nspawn and has different\nareas for different\nPvP styles.\n\nSome areas may allow\nwebs, traps, carts, or\nother mechanics.\n\n§c§lIt is dangerous.§r"},{raw:"§6§lECONOMY§r\n\nThe economy uses\n§6§lRaw Gold§r.\n\nYou can trade, deposit, withdraw, and pay other players.\n\nRaw Gold is also used to rent market stalls, start events, and more."},{raw:"§6§lMARKET§r\n\nMarket is a safe zone.\n\nPlayers can rent stalls and create item-for-item\nshops.\n\n§aTrade resources\ndirectly with other\nplayers.§r"},{raw:"§3§lHOMES§r\n\nUse §3/sethome [name]§r\nto save a location.\n\nUse §3/homes§r\nto view your saved homes.\n\nHomes help you travel,\nbut they §c§ldo not\nprotect§r the area."},{raw:"§3§lTELEPORTS§r\n\nUse §3/tpa [player]§r\nto request a teleport.\n\nUse §3/tpaccept§r\nto accept one.\n\n§c§lBe careful§r\nwho you trust.\n\nTrapping is allowed"},{raw:"§5§lREPUTATION§r\n\nUse §3/rep [player]§r to apply a positive or negative reputation to a player.\n\nYou can only rep each player once. But you can change your rep every 24 hours.\n\n§aGood rep builds trust.§r\n§cBad rep warns others.§r"},{raw:"§2§lGUILDS§r\n\nGuilds are groups of\nplayers. Like a team.\n\nJoin or create one to\nteam up, make allies,\nand compete in guild\nevents.\n\nUse §3/guild§  help\nfor guild commands."},{raw:"§5§lEVENTS§r\nEvents happen often and are separate from normal survival.\n\nYou may see PvP games, races, parkour, KOTH,\ntrivia, and more.\n\n§6Join for rewards\nand competition.§r"},{raw:"§3§lCOMMANDS§r\n§3/help§r\nView commands.\n§3/report§r\nReport issues.\n§3/rules§r\nView server rules.\n§3/discord§r\nJoin the community.\n§3/wiki§r\nLearn more."},{raw:"§9§lWEBSITE§r\n\nJoin the Discord for\nnews, events, support,\nand community.\n\n§3§lwww.enthusia.info§r\n\nThe website has many useful tools such as the rules."},{raw:"§6§lFINAL NOTES§r\n\nBuild, trade, fight,\nexplore, make allies,\nmake enemies, or\ndisappear into the wilderness.\n\n§7§lYour story is yours to make.§r\n\n§a§lHave fun!§r"}]}'
  schema_version: 1
