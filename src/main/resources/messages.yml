config-version: 4
prefix: "&6[Diary] &r"

non-owner-edit: "&cYou can read this diary, but only the owner can edit it."
signing-disabled: "&eDiaries stay writable; signing is disabled."
ascii-only: "&cDiaries only allow standard English keyboard characters and basic symbols."
void-returned: "&aA diary that fell into the void was returned to you."
reload-complete: "&aConfig, messages, and runtime settings reloaded."

staff:
  enderchest-diary-alert: "&cStaff Alert: &e{player} &chas a diary or diary-containing item in their ender chest."
  guild-vault-diary-alert: "&cStaff Alert: &e{vault} &chas a diary or diary-containing item inside. Opened by &e{player}&c."

admin:
  no-permission: "&cNo permission."
  invalid-target: "&cThat player could not be resolved."
  unknown-subcommand: "&cUnknown subcommand. Try /diary"
  usage-header: "&eDiary commands:"
  usage-reload: "&e/diary reload"
  usage-issue: "&e/diary issue <player|uuid> &7- issue if never issued before"
  usage-status: "&e/diary status <player|uuid> &7- show issuance and queue state"
  usage-find: "&e/diary find <player|uuid|diaryId> &7- show the last tracked location"
  usage-restore: "&e/diary restore <player|uuid|diaryId> &7- restore from the saved snapshot"
  issue-usage: "&cUsage: /diary issue <player|uuid>"
  issue-success: "&aIssued a diary to &e{player}&a."
  issue-queued: "&aIssued a diary to &e{player}&a and queued it for delivery."
  issue-already-issued: "&e{player} has already been issued a diary."
  status-usage: "&cUsage: /diary status <player|uuid>"
  status-player: "&ePlayer: &f{player}"
  status-issued: "&eIssued: &f{issued}"
  status-diary-id: "&eDiary ID: &f{id}"
  status-queued: "&eQueued Deliveries: &f{count}"
  status-active-copies: "&eKnown Active Copies: &f{count}"
  status-recent-locations: "&eRecent Locations: &f{count}"
  status-pending-purges: "&ePending Purges: &f{count}"
  status-last-location: "&eLast Tracked Location: &f{location}"
  status-snapshot-time: "&eLast Snapshot Time: &f{time}"

find:
  usage: "&cUsage: /diary find <player|uuid|diaryId>"
  not-found: "&cNo tracked diary record was found for that query."
  result-owner: "&eOwner: &f{player}"
  result-id: "&eDiary ID: &f{id}"
  result-location: "&eLast Known Location: &f{location}"

restore:
  usage: "&cUsage: /diary restore <player|uuid|diaryId> [owner|admin|duplicate]"
  not-found: "&cNo restorable diary snapshot was found for that query."
  console-explicit: "&cConsole must use an explicit restore mode: owner or duplicate."
  admin-player-only: "&cOnly an in-game admin can use the admin restore destination."
  gui-opened: "&eRestore confirmation opened."
  duplicate-started: "&cWarning: an additional diary copy was intentionally restored without purging existing copies."
  duplicate-blocked: "&cCannot create an extra diary copy while a purge is active. Finish or cancel that purge first, or use the in-game emergency recovery action."

purge:
  usage: "&cUsage: /diary purge <player|diaryId|status|cancel|resume|list>"
  status-usage: "&cUsage: /diary purge status <operationId|player|diaryId>"
  control-usage: "&cUsage: /diary purge <cancel|resume> <operationId>"
  not-found: "&cNo matching purge operation was found."
  none: "&eNo purge operations are recorded."
  start-failed: "&cThe purge operation could not be started."
  started: "&aPurge operation &e{operation} &astarted. State: &e{state}&a, pending players: &e{players}&a, pending chunks: &e{chunks}&a."
  control-success: "&aPurge operation updated."
  control-failed: "&cThat purge operation cannot be updated in its current state."
  restore-delivered: "&aThe restored diary was delivered to your inventory."
  restore-queued: "&eYour restored diary is queued because it could not be delivered now."
