name: DiaryKeeper
main: com.p2wn.diary.DiaryPlugin
version: 1.3.1
api-version: '1.21'
authors: [ P2wn ]
description: One-of-a-kind, owner-editable collectible diaries with safe queueing and duplicate warnings
softdepend: [ Plan, Nexo ]
commands:
  diary:
    description: Diary admin
    usage: /diary <reload|issue <player|uuid>|status <player|uuid>|find <player|uuid|diaryId>|restore <player|uuid|diaryId>|scan <duplicates|locations>|repair>
    permission: diary.admin

permissions:
  diary.admin:
    default: op
  diary.notify:
    default: op
