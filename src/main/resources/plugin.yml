name: DiaryKeeper
main: com.p2wn.diary.DiaryPlugin
version: 1.4.8
api-version: '1.21'
authors: [ P2wn ]
description: One-of-a-kind, owner-editable collectible diaries with safe queueing and duplicate warnings
softdepend: [ Plan, Nexo, floodgate ]
commands:
  diary:
    description: Diary admin
    usage: /diary <reload|issue|status|find|restore|purge|scan|repair>
    permission: diary.admin

permissions:
  diary.admin:
    default: op
  diary.notify:
    default: op
